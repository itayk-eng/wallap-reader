<style>
/* Layout: drafting-sheet tool. Title block strip on top, summary tiles, then tabbed sheets (section, loads, forces, anchors, stages). */
:root {
  --bg: #f3f5f4;
  --surface: #ffffff;
  --surface-2: #eef1f0;
  --ink: #172024;
  --ink-2: #48545a;
  --muted: #76828a;
  --line: #d6dcdb;
  --grid: #e7ebea;
  --accent: #1d5a82;
  --accent-ink: #ffffff;
  --accent-soft: #dde9f2;
  --s1: #2a78d6;           /* series 1 */
  --s2: #eb6834;           /* series 2 */
  --s3: #1baf7a;           /* series 3 */
  --water: #2a78d6;
  --anchor: #d2551f;
  --wall: #22292c;
  --soil-1: #ece3cf; --soil-2: #dccca6; --soil-3: #c9b387; --soil-4: #b39a6c;
  --soil-line: #a8977a;
  --good: #0ca30c; --warn: #b77a00; --crit: #d03b3b;
  --font-display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Public Sans", "Segoe UI", Helvetica, Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121617; --surface: #1a1f21; --surface-2: #222829; --ink: #eef2f1; --ink-2: #b9c3c4; --muted: #8b979a;
  --line: #333b3d; --grid: #283032; --accent: #6fb0dd; --accent-ink: #0d1a22; --accent-soft: #1d3342;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --water: #4f98ec; --anchor: #ef7a45; --wall: #dfe6e6;
  --soil-1: #36312a; --soil-2: #423a2d; --soil-3: #4f4432; --soil-4: #5c4f38; --soil-line: #6f6350;
  --good: #2fbf2f; --warn: #e0a326; --crit: #e66767; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121617; --surface: #1a1f21; --surface-2: #222829; --ink: #eef2f1; --ink-2: #b9c3c4; --muted: #8b979a;
  --line: #333b3d; --grid: #283032; --accent: #6fb0dd; --accent-ink: #0d1a22; --accent-soft: #1d3342;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --water: #4f98ec; --anchor: #ef7a45; --wall: #dfe6e6;
  --soil-1: #36312a; --soil-2: #423a2d; --soil-3: #4f4432; --soil-4: #5c4f38; --soil-line: #6f6350;
  --good: #2fbf2f; --warn: #e0a326; --crit: #e66767; color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font-body); }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 20px; padding-block: 16px 48px; display: flex; flex-direction: column; gap: 16px; }
@media (max-width: 520px) { .wrap { padding-inline: 16px; } }
h1, h2, h3 { font-family: var(--font-display); font-stretch: 87%; margin: 0; text-wrap: balance; letter-spacing: 0.005em; }
.mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
button, .btn { font: 500 13px/1 var(--font-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 9px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
button:hover, .btn:hover { border-color: var(--muted); }
button:focus-visible, .btn:focus-within, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

/* top bar */
.topbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { flex: none; }
.brand h1 { font-size: 20px; font-weight: 700; }
.brand small { display: block; color: var(--muted); font-size: 12px; font-family: var(--font-body); font-weight: 400; letter-spacing: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.seg button { border: 0; border-radius: 0; padding: 9px 11px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }

/* title block */
.titleblock { display: grid; grid-template-columns: minmax(0, 2.2fr) repeat(4, minmax(0, 1fr)); border: 1px solid var(--ink-2); background: var(--surface); border-radius: 2px; }
.titleblock > div { padding: 8px 12px; border-left: 1px solid var(--line); min-width: 0; }
.titleblock > div:first-child { border-left: 0; }
.tb-label { font: 500 10px/1.2 var(--font-body); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.tb-val { font: 600 15px/1.35 var(--font-display); font-stretch: 87%; overflow-wrap: anywhere; }
.tb-val.big { font-size: 22px; }
.tb-sub { color: var(--ink-2); font-size: 12px; overflow-wrap: anywhere; }
.chip { display: inline-flex; align-items: center; gap: 5px; font: 600 11px/1 var(--font-body); padding: 4px 7px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); letter-spacing: 0.02em; white-space: nowrap; }
.chip.example { background: var(--accent-soft); color: var(--ink); }
.chip.good { color: var(--good); } .chip.crit { color: var(--crit); } .chip.warn { color: var(--warn); }
@media (max-width: 860px) { .titleblock { grid-template-columns: repeat(2, minmax(0, 1fr)); } .titleblock > div:first-child { grid-column: 1 / -1; } .titleblock > div { border-top: 1px solid var(--line); } .titleblock > div:nth-child(2) { border-left: 0; } .titleblock > div:nth-child(4) { border-left: 0; } .titleblock > div:first-child { border-top: 0; } }

/* KPI tiles */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpi .k-label { font: 500 11px/1.2 var(--font-body); text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
.kpi .k-val { font: 600 26px/1.1 var(--font-display); font-stretch: 87%; font-variant-numeric: tabular-nums; }
.kpi .k-val span { font: 500 12px var(--font-mono); color: var(--ink-2); margin-left: 4px; }
.kpi .k-sub { font-size: 12px; color: var(--ink-2); }

/* tabs */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: none; border-radius: 0; padding: 11px 14px; font-weight: 500; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.sheet { display: flex; flex-direction: column; gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.panel h2 { font-size: 17px; font-weight: 600; }
.panel h3 { font-size: 14px; font-weight: 600; }
.panel-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px 16px; margin-bottom: 12px; }
.hint { color: var(--muted); font-size: 12px; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
@media (max-width: 920px) { .two { grid-template-columns: minmax(0, 1fr); } }

/* stage stepper */
.stepper { display: flex; flex-wrap: wrap; gap: 6px; }
.stepper button { flex-direction: column; align-items: flex-start; gap: 3px; padding: 7px 10px; max-width: 250px; text-align: left; }
.stepper button b { font: 600 11px/1 var(--font-body); text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
.stepper button span { font-size: 12px; line-height: 1.3; color: var(--ink); }
.stepper button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.stepper button:disabled { opacity: 0.45; cursor: not-allowed; }

/* tables */
.tscroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 7px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font: 600 11px/1.3 var(--font-body); color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; vertical-align: bottom; }
th small { display: block; text-transform: none; letter-spacing: 0; font-weight: 400; font-family: var(--font-mono); }
td { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
th:first-child, td:first-child, td.l, th.l { text-align: left; }
td.txt { font-family: var(--font-body); white-space: normal; min-width: 200px; }
tr.gov td { background: var(--accent-soft); font-weight: 500; }
.swatch { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -2px; margin-right: 6px; border: 1px solid var(--soil-line); }

/* key list */
.keys { display: flex; flex-direction: column; gap: 0; }
.keys div { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px dashed var(--line); }
.keys div:last-child { border-bottom: 0; }
.keys dt, .keys span:first-child { color: var(--ink-2); }
.keys b { font: 500 13px var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); }
.legend i { display: inline-block; width: 16px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 6px; }
.legend i.dash { border-top-style: dashed; }
.legend i.dot { border-top-style: dotted; }

/* drawings & charts */
.drawing { width: 100%; overflow-x: auto; }
.drawing svg { display: block; width: 100%; height: auto; min-width: 520px; }
svg text { font-family: var(--font-body); }
svg .t-mono { font-family: var(--font-mono); }
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; }
.chart { position: relative; min-width: 0; }
.chart svg { display: block; width: 100%; height: auto; touch-action: pan-y; }
.chart h3 { font-size: 13px; margin-bottom: 2px; }
.chart .unit { font: 400 11px var(--font-mono); color: var(--muted); }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 5px 8px; font: 12px/1.35 var(--font-mono); box-shadow: 0 2px 8px rgb(0 0 0 / 0.12); white-space: nowrap; z-index: 2; }
.tip b { font-weight: 500; }

/* drop overlay */
.drop { position: fixed; inset: 0; background: color-mix(in srgb, var(--bg) 82%, transparent); display: grid; place-items: center; z-index: 20; border: 3px dashed var(--accent); }
.drop div { font: 600 22px var(--font-display); color: var(--ink); background: var(--surface); padding: 18px 26px; border-radius: var(--r); border: 1px solid var(--line); }
.msg { border: 1px solid var(--line); border-left: 3px solid var(--warn); background: var(--surface); padding: 10px 14px; border-radius: var(--r); font-size: 13px; }
.msg.err { border-left-color: var(--crit); }
.msg.ok { border-left-color: var(--good); }

.drawing { position: relative; }
.drawing.compact svg { min-width: 260px; }
.drawing .tip { z-index: 3; }
.trio { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
.trio-item { min-width: 0; display: flex; flex-direction: column; }
.trio-item h3 { font-size: 14px; }
.trio-item .unit { font: 400 11px var(--font-mono); color: var(--muted); }
table.compact th, table.compact td { padding: 6px 6px; }
button.link { border: 0; background: none; color: var(--accent); padding: 4px 2px; text-decoration: underline; text-underline-offset: 3px; font-weight: 600; }
button.link:hover { border: 0; }
.dz-globals { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: flex-end; }
.dz-globals label, .dz-in label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--ink-2); font-weight: 500; }
.dz-in label { flex-direction: row; gap: 6px; align-items: baseline; }
.dz-derived { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--ink-2); font-weight: 500; }
.dz-derived b { font: 600 15px/1 var(--font-mono); color: var(--ink); padding: 10px 0; }
.u { color: var(--muted); font: 400 11px var(--font-mono); }
input[type=number] { font: 500 14px var(--font-mono); padding: 7px 9px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); color: var(--ink); width: 104px; }
input[type=number]:focus-visible, input[type=range]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
input[type=range] { accent-color: var(--accent); width: 100%; max-width: 260px; }
.dz-grid { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1fr) minmax(0, 1.4fr); gap: 24px; align-items: start; }
@media (max-width: 960px) { .dz-grid { grid-template-columns: minmax(0, 1fr); } }
.dz-in { display: flex; flex-direction: column; gap: 6px; }
.dz-req .k-label { font: 500 11px/1.2 var(--font-body); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.dz-req .big { font: 600 34px/1.15 var(--font-display); font-stretch: 87%; font-variant-numeric: tabular-nums; margin: 4px 0; }
.dz-req .big span { font: 500 12px var(--font-mono); color: var(--ink-2); margin-left: 6px; }
.inrow { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.inrow button:not(.link) { padding: 7px 12px; font-size: 16px; line-height: 1; }
.verdict { font: 600 16px/1.3 var(--font-display); font-stretch: 87%; margin-bottom: 6px; }
.verdict.good { color: var(--good); } .verdict.crit { color: var(--crit); }
.meter { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; margin-bottom: 8px; }
.meter i { display: block; height: 100%; background: var(--good); border-radius: 4px; }
.meter.over i { background: var(--crit); }
b.bad { color: var(--crit); }
table.mx { border-collapse: separate; border-spacing: 4px; width: auto; }
table.mx th, table.mx td { border: 0; padding: 0 6px 0 0; }
table.mx td { padding: 0; }
.mx-cell { width: 70px; height: 38px; justify-content: center; font: 500 12px var(--font-mono); border-radius: 4px; padding: 0; }
.mx-cell.ok, .mx-sw.ok { background: color-mix(in srgb, var(--good) 16%, var(--surface)); border-color: color-mix(in srgb, var(--good) 40%, var(--line)); color: var(--ink); }
.mx-cell.fail, .mx-sw.fail { background: var(--surface-2); color: var(--muted); border-color: var(--line); }
.mx-cell.first { font-weight: 700; }
.mx-cell.sel { outline: 2.5px solid var(--accent); outline-offset: 1px; }

.exp-opts { display: flex; flex-wrap: wrap; gap: 16px 28px; align-items: flex-end; }
.exp-opts fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px 16px; }
.exp-opts legend { font-size: 12px; font-weight: 500; color: var(--ink-2); padding: 0; margin-bottom: 6px; }
label.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
label.chk input { accent-color: var(--accent); width: 16px; height: 16px; }
.sel { display: flex; flex-direction: column; gap: 5px; font-size: 12px; font-weight: 500; color: var(--ink-2); }
select { font: 500 13px var(--font-body); padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); color: var(--ink); max-width: 100%; }
select:focus-visible, label.chk input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.exp-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.exp-msg { min-height: 1.4em; margin: 10px 0 0; font-size: 13px; color: var(--ink-2); }
.exp-msg.ok { color: var(--good); } .exp-msg.err { color: var(--crit); }
.exp-notes { margin: 8px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; max-width: 95ch; }
.paper-grid { display: flex; gap: 16px; align-items: flex-start; }
@media (max-width: 760px) { .paper-grid { flex-direction: column; } .paper-grid .paper { width: 100%; } }
.paper { margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.paper-sheet { background: #ffffff; border: 1px solid var(--line); border-radius: 3px; padding: 10px; box-shadow: 0 1px 3px rgb(0 0 0 / 0.08); }
.paper-sheet svg { display: block; width: 100%; height: auto; }
.paper figcaption { font-size: 12px; color: var(--ink-2); }

.btn.sm { padding: 6px 9px; font-size: 12px; }
.exp-quick { display: inline-flex; gap: 6px; margin-left: auto; }
.panel-head .exp-quick { order: 3; }
.trio-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: var(--r); font-size: 13px; z-index: 30; max-width: calc(100% - 32px); box-shadow: 0 4px 16px rgb(0 0 0 / 0.2); }
.toast.err { background: var(--crit); color: #fff; }

#printArea { display: none; }
@media print {
  body > *:not(#printArea) { display: none !important; }
  body { background: #ffffff !important; }
  #printArea { display: block; }
  .print-page { break-after: page; page-break-after: always; display: flex; flex-direction: column; align-items: flex-start; }
  .print-page:last-child { break-after: auto; page-break-after: auto; }
  .print-page svg { display: block; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .print-note { font: 8pt Helvetica, Arial, sans-serif; color: #555555; margin: 2mm 0 0; }
}

.upload { display: flex; flex-direction: column; gap: 10px; }
.dropzone { position: relative; display: flex; align-items: center; gap: 14px; padding: 12px 16px; border: 1.5px dashed var(--muted); border-radius: var(--r); background: var(--surface); cursor: pointer; color: var(--ink-2); flex-wrap: wrap; }
.dropzone:hover, .dropzone:focus-within { border-color: var(--accent); background: var(--accent-soft); }
.dropzone:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.dropzone input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.dz-text { display: flex; flex-direction: column; gap: 2px; flex: 1 1 260px; min-width: 0; }
.dz-text b { color: var(--ink); font: 600 15px/1.3 var(--font-display); font-stretch: 87%; }
.dz-text span { font-size: 13px; }
.dz-btn { pointer-events: none; }
.upload.big .dropzone { padding: 28px 26px; border-width: 2px; gap: 20px; }
.upload.big .dz-text b { font-size: 22px; }
.upload.big .dz-text span { font-size: 14px; }
.dz-note { margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.rchip { display: inline-flex; align-items: stretch; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); overflow: hidden; max-width: 100%; }
.rchip button { border: 0; border-radius: 0; background: none; padding: 6px 10px; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; display: inline-block; }
.rchip button em { font-style: normal; color: var(--muted); font-size: 11px; margin-left: 4px; }
.rchip .x { padding: 6px 9px 6px 4px; color: var(--muted); font-size: 14px; line-height: 1; }
.rchip .x:hover { color: var(--crit); }
.rchip.on { border-color: var(--accent); background: var(--accent-soft); }

<div class="wrap">

<script>
// Rebuild fixed-width text lines from pdf.js text items (WALLAP prints in a monospace font)
function itemsToLines(items){
  const its = items.filter(i => i.str && i.str.trim() !== '' && i.width > 0);
  // estimate character pitch
  const pitches = {};
  for (const i of its) if (i.str.length >= 2) { const k = (i.width / i.str.length).toFixed(2); pitches[k] = (pitches[k]||0) + i.str.length; }
  let cw = 5.4, best = 0;
  for (const k in pitches) if (pitches[k] > best) { best = pitches[k]; cw = +k; }
  const mono = its.filter(i => Math.abs(i.width / i.str.length - cw) < 0.15 * cw);
  if (!mono.length) return [];
  const left = Math.min(...mono.map(i => i.transform[4]));
  const rows = [];
  for (const i of mono) {
    const y = i.transform[5];
    let r = rows.find(r => Math.abs(r.y - y) < 2);
    if (!r) { r = { y, parts: [] }; rows.push(r); }
    r.parts.push(i);
  }
  rows.sort((a, b) => b.y - a.y);
  return rows.map(r => {
    r.parts.sort((a, b) => a.transform[4] - b.transform[4]);
    let s = '';
    for (const p of r.parts) {
      const col = Math.max(0, Math.round((p.transform[4] - left) / cw));
      if (s.length < col) s += ' '.repeat(col - s.length);
      else if (s.length > col && s.length && s[s.length-1] !== ' ') s += ' ';
      s += p.str;
    }
    return s.replace(/\s+$/, '');
  });
}
async function pdfToText(pdfjsLib, data){
  const doc = await pdfjsLib.getDocument({ data, verbosity: 0 }).promise;
  const pages = [];
  for (let p = 1; p <= doc.numPages; p++) {
    const page = await doc.getPage(p);
    const tc = await page.getTextContent();
    pages.push(itemsToLines(tc.items).join('\n'));
  }
  return pages.join('\n\f\n');
}
if (typeof module !== 'undefined') module.exports = { itemsToLines, pdfToText };

// WALLAP text-report parser. Input: full text (fixed-width lines). Output: plain object.
function parseWallap(text) {
  const NUM = '-?\\d*\\.?\\d+(?:[Ee][-+]?\\d+)?';
  const isNum = s => new RegExp('^' + NUM + '$').test(s);
  const num = s => { const v = parseFloat(s); return isNaN(v) ? null : v; };
  const raw = text.replace(/\r/g, '').split('\n');
  const R = { meta: {}, strata: [], soils: [], water: {}, wall: {}, struts: [], surcharges: [], stages: [],
    options: {}, results: {}, summary: { stability: [], envelope: [], stageMax: [], stageDisp: [], strutForces: [] }, warnings: [] };

  // ---- header / meta, then strip repeated page headers
  const lines = [];
  for (const l of raw) {
    let m;
    if ((m = l.match(/^(.*?)\s*\|\s*Sheet No/))) { if (!R.meta.company && m[1].trim()) R.meta.company = m[1].trim(); continue; }
    if ((m = l.match(/Program:\s*(WALLAP[^|]*)/))) { R.meta.program = R.meta.program || m[1].replace(/\s+/g, ' ').trim(); }
    if ((m = l.match(/Job No\.?\s*(.+)$/))) { R.meta.job = R.meta.job || m[1].trim(); }
    if ((m = l.match(/Made by\s*:\s*(\S*)/))) { R.meta.madeBy = R.meta.madeBy || m[1]; }
    if ((m = l.match(/Run ID[.:]?\s*(.+?)\s*(\||$)/))) { R.meta.runId = R.meta.runId || m[1].trim(); }
    if ((m = l.match(/^(.*?)\s*\|\s*Checked/))) { if (!R.meta.title && m[1].trim()) R.meta.title = m[1].trim(); continue; }
    if ((m = l.match(/Units:\s*(\S+)/))) { R.meta.units = R.meta.units || m[1]; continue; }
    if (/Program:\s*WALLAP|Licensed from|Data filename|^\s*Run ID|^-{30,}\s*$|^\s*\(continued\)\s*$|\|\s*$|^\f$/.test(l)) continue;
    if (/^Program WALLAP - Copyright|Rodenhurst Road/.test(l)) continue;
    lines.push(l);
  }
  const units = (R.meta.units || 't,m').split(',');
  R.meta.forceUnit = units[0] || 't';
  R.meta.lengthUnit = units[1] || 'm';

  const HEAD = /^[A-Z][A-Z ,&/-]{4,}$/; // all-caps section headings
  const find = (re, from = 0) => { for (let i = from; i < lines.length; i++) if (re.test(lines[i])) return i; return -1; };
  const toks = l => l.trim().split(/\s+/);
  const sectionRows = (start) => { const out = []; for (let i = start + 1; i < lines.length; i++) { const l = lines[i]; if (HEAD.test(l.trim()) && !/^\s/.test(l)) break; out.push(l); } return out; };

  // ---- SOIL PROFILE
  let i = find(/^SOIL PROFILE/);
  if (i >= 0) for (const l of sectionRows(i)) {
    const m = l.match(new RegExp('^\\s*(\\d+)\\s+(' + NUM + ')\\s+(\\d+)\\s+(.+?)\\s{2,}(\\d+)\\s+(.+?)\\s*$'));
    if (m) R.strata.push({ no: +m[1], top: num(m[2]), activeSoil: +m[3], activeName: m[4].trim(), passiveSoil: +m[5], passiveName: m[6].trim() });
  }
  // ---- SOIL PROPERTIES
  i = find(/^SOIL PROPERTIES/);
  if (i >= 0) { const rows = sectionRows(i); for (let k = 0; k < rows.length; k++) {
    const m = rows[k].match(new RegExp('^\\s*(\\d+)\\s+(.+?)\\s+(' + NUM + ')a\\s+(' + NUM + ')\\s+(' + NUM + ')\\s+(OC|NC)\\s+(' + NUM + ')\\s+(' + NUM + ')(?:\\s+(' + NUM + '))?'));
    if (!m) continue;
    const s = { no: +m[1], name: m[2].trim(), gammaAbove: num(m[3]), E: num(m[4]), K0: num(m[5]), consol: m[6], Ka: num(m[7]), Kp: num(m[8]), c: m[9] ? num(m[9]) : 0 };
    const n = rows[k + 1] || '';
    const b = n.match(new RegExp('(' + NUM + ')b'));
    if (b) { s.gammaBelow = num(b[1]); const p = [...n.matchAll(new RegExp('\\(\\s*(' + NUM + ')\\s*\\)', 'g'))].map(x => num(x[1])); s.nu = p[0]; s.Kac = p[1]; s.Kpc = p[2]; }
    R.soils.push(s);
  } }
  // ---- Additional parameters (friction angles)
  i = find(/^Additional soil parameters/);
  if (i >= 0) for (const l of sectionRows(i)) {
    const m = l.match(new RegExp('^\\s*(\\d+)\\s+(.+?)\\s+(' + NUM + ')\\s+(' + NUM + ')\\s+(' + NUM + ')\\s+(' + NUM + ')\\s+(' + NUM + ')\\s+(' + NUM + ')\\s*$'));
    if (m) { const s = R.soils.find(x => x.no === +m[1]); if (s) Object.assign(s, { phiA: num(m[3]), adhA: num(m[4]), backA: num(m[5]), phiP: num(m[6]), adhP: num(m[7]), backP: num(m[8]) }); }
  }
  // ---- Water
  let m = text.match(new RegExp('Density of water\\s*=\\s*(' + NUM + ')')); if (m) R.water.density = num(m[1]);
  m = text.match(new RegExp('Initial water table elevation\\s+(' + NUM + ')\\s+(' + NUM + ')'));
  if (m) { R.water.active = num(m[1]); R.water.passive = num(m[2]); }
  m = text.match(/Automatic water pressure balancing at toe of wall\s*:\s*(\w+)/); if (m) R.water.balancing = m[1];
  // ---- Wall
  const grab = (re, key, obj = R.wall, asText) => { const mm = text.match(re); if (mm) obj[key] = asText ? mm[1].trim() : num(mm[1]); };
  grab(/Type of structure\s*=\s*(.+)/, 'type', R.wall, true);
  grab(new RegExp('Elevation of toe of wall\\s*=\\s*(' + NUM + ')'), 'toe');
  grab(new RegExp('Youngs modulus of wall E\\s*=\\s*(' + NUM + ')'), 'E');
  grab(new RegExp('Moment of inertia of wall I\\s*=\\s*(' + NUM + ')'), 'I');
  grab(new RegExp('E\\.I\\s*=\\s*(' + NUM + ')'), 'EI');
  grab(/Yield Moment of wall\s*=\s*(.+)/, 'yieldMoment', R.wall, true);
  // ---- Struts & anchors
  i = find(/^STRUTS and ANCHORS/);
  if (i >= 0) for (const l of sectionRows(i)) {
    const t = toks(l);
    if (t.length >= 8 && /^\d+$/.test(t[0]) && isNum(t[1]) && /^(Yes|No)$/i.test(t[t.length - 1])) {
      const n = t.slice(1, -1).map(num);
      const s = { no: +t[0], elev: n[0], spacing: n[1], area: n[2], E: n[3], tension: t[t.length - 1] };
      if (n.length >= 7) { s.freeLength = n[4]; s.incl = n[5]; s.prestress = n[6]; }
      else if (n.length === 6) { s.freeLength = n[4]; s.incl = n[5]; s.prestress = 0; }
      R.struts.push(s);
    }
  }
  // ---- Surcharges
  i = find(/^SURCHARGE LOADS/);
  if (i >= 0) for (const l of sectionRows(i)) {
    const mm = l.match(new RegExp('^\\s*(\\d+)\\s+(' + NUM + ')\\s+(' + NUM + ')\\((A|P)\\)\\s+(.*)$'));
    if (!mm) continue;
    const rest = toks(mm[5]);
    const s = { no: +mm[1], elev: num(mm[2]), dist: num(mm[3]), side: mm[4] === 'A' ? 'active' : 'passive' };
    // length, width may be blank for infinite strip; last three tokens: far edge, equiv soil, partial factor
    const numsBefore = []; for (const t of rest) { if (isNum(t)) numsBefore.push(num(t)); else break; }
    if (numsBefore.length >= 3) { s.length = numsBefore[0]; s.width = numsBefore[1]; s.qNear = numsBefore[2]; if (numsBefore.length >= 4) s.qFar = numsBefore[3]; }
    else if (numsBefore.length === 1) s.qNear = numsBefore[0];
    else if (numsBefore.length === 2) { s.width = numsBefore[0]; s.qNear = numsBefore[1]; }
    if (s.qFar == null) s.qFar = s.qNear;
    R.surcharges.push(s);
  }
  // ---- Construction stages
  i = find(/^CONSTRUCTION STAGES/);
  if (i >= 0) for (const l of sectionRows(i)) {
    const mm = l.match(/^\s*(\d+)\s{2,}(\S.*?)\s*$/);
    if (mm) R.stages.push({ no: +mm[1], desc: mm[2] });
  }
  // ---- Options
  grab(new RegExp('Length of wall \\(normal to plane of analysis\\)\\s*=\\s*(' + NUM + ')'), 'wallLength', R.options);
  grab(new RegExp('Elevation of rigid lower boundary\\s*=\\s*(' + NUM + ')'), 'lowerBoundary', R.options);
  grab(new RegExp('Factor on soil strength for calculating wall depth\\s*=\\s*(' + NUM + ')'), 'fosTarget', R.options);
  grab(/Method of analysis\s*-\s*(.+)/, 'stabilityMethod', R.options, true);
  grab(/Bending moment and displacement calculation:\s*\n\s*Method\s*-\s*(.+)/, 'bmMethod', R.options, true);

  // ---- Per-stage detailed results + summary
  const stabRow = (l) => {
    const mm = l.match(new RegExp('^\\s*(\\d+)\\s+(' + NUM + ')\\s+(' + NUM + ')\\s+(Cant\\.|' + NUM + ')\\s+(.*)$'));
    if (!mm) return null;
    const o = { stage: +mm[1], glActive: num(mm[2]), glPassive: num(mm[3]), strutElev: mm[4] === 'Cant.' ? null : num(mm[4]) };
    const rest = mm[5].trim();
    if (/Conditions not suitable/i.test(rest)) o.note = 'Not suitable for FoS calc.';
    else { const t = toks(rest); o.fos = num(t[0]); o.momentElev = t[1] === 'n/a' ? null : num(t[1]); o.toeForFos = num(t[2]); o.penetration = num(t[3]); }
    return o;
  };
  let stage = null, inSummary = false;
  for (let k = 0; k < lines.length; k++) {
    const l = lines[k];
    let mm;
    if (/^Summary of results/.test(l)) { inSummary = true; stage = null; continue; }
    if ((mm = l.match(/^Stage No\.\s*(\d+)\s+(.*)$/))) {
      const no = +mm[1];
      if (!R.results[no]) R.results[no] = { no, desc: mm[2].trim(), nodes: [], active: [], passive: [], strutForces: [] };
      stage = R.results[no]; inSummary = false; continue;
    }
    if (/^STABILITY ANALYSIS/.test(l)) {
      for (let j = k + 1; j < lines.length && j < k + 20; j++) {
        const o = stabRow(lines[j]);
        if (o) { if (inSummary) R.summary.stability.push(o); else if (stage) stage.stability = o; }
        else if (/^BENDING MOMENT|^Summary|^Stage No/.test(lines[j])) break;
      }
      continue;
    }
    if (stage && /^\s*Node\s+Y\s+Nett/.test(l)) {
      let last = null;
      for (k = k + 1; k < lines.length; k++) {
        const r = lines[k]; if (!r.trim()) continue;
        if (/^\s*(no\.|t\/m2|coord)/.test(r) || /^\s+t\/m2/.test(r)) continue;
        const t = toks(r);
        if ((mm = r.match(new RegExp('At elev\\.\\s*(' + NUM + ')\\s*Strut force\\s*=\\s*(' + NUM + ')\\s*\\S*\\/strut\\s*=\\s*(' + NUM + ')')))) {
          const sf = { elev: num(mm[1]), perStrut: num(mm[2]), perM: num(mm[3]) };
          const nx = lines[k + 1] || ''; const mi = nx.match(new RegExp('=\\s*(' + NUM + ').*inclined'));
          if (mi) { sf.perMInclined = num(mi[1]); k++; }
          stage.strutForces.push(sf); continue;
        }
        if (t.every(isNum) && /^\d+$/.test(t[0]) && t.length >= 7) {
          last = { node: +t[0], y: num(t[1]), nett: num(t[2]), disp: num(t[3]), rot: num(t[4]), V: num(t[5]), M: num(t[6]) };
          if (t[7] != null) last.strut = num(t[7]);
          stage.nodes.push(last); continue;
        }
        if (t.every(isNum) && t.length >= 5 && t.length <= 6 && last) {
          stage.nodes.push({ node: last.node, y: last.y, nett: num(t[0]), disp: num(t[1]), rot: num(t[2]), V: num(t[3]), M: num(t[4]), sub: true }); continue;
        }
        k--; break;
      }
      continue;
    }
    if (stage && /-{5,}\s*(ACTIVE|PASSIVE) side\s*-{5,}/.test(l)) {
      const side = /ACTIVE/.test(l) ? 'active' : 'passive';
      let last = null;
      for (k = k + 1; k < lines.length; k++) {
        const r = lines[k]; if (!r.trim()) continue;
        if (/^\s*(no\.|coord|Water|t\/m)/.test(r) || /Effective stresses|press\.|t\/m2\s+t\/m2/.test(r)) continue;
        const t = toks(r);
        const clean = t.map(x => x.replace(/[apA]$/, ''));
        const flag = (t.find(x => /\d[apA]$/.test(x)) || '').slice(-1) || null;
        if (clean.every(isNum) && /^\d+$/.test(t[0]) && t.length === 9) {
          last = { node: +t[0], y: num(t[1]), water: num(clean[2]), vert: num(clean[3]), alim: num(clean[4]), plim: num(clean[5]), earth: num(clean[6]), total: num(clean[7]), k: num(clean[8]), flag };
          stage[side].push(last); continue;
        }
        if (clean.every(isNum) && t.length === 7 && last) {
          stage[side].push({ node: last.node, y: last.y, water: num(clean[0]), vert: num(clean[1]), alim: num(clean[2]), plim: num(clean[3]), earth: num(clean[4]), total: num(clean[5]), k: num(clean[6]), flag, sub: true }); continue;
        }
        k--; break;
      }
      continue;
    }
    if (inSummary && /^Bending moment, shear force and displacement envelopes/.test(l)) {
      for (k = k + 1; k < lines.length; k++) {
        const t = toks(lines[k]); if (!lines[k].trim() || !/^\d+$/.test(t[0])) { if (R.summary.envelope.length && /^[A-Z]/.test(lines[k])) { k--; break; } continue; }
        if (t.length === 8 && t.every(isNum)) R.summary.envelope.push({ node: +t[0], y: num(t[1]), dMax: num(t[2]), dMin: num(t[3]), MMax: num(t[4]), MMin: num(t[5]), VMax: num(t[6]), VMin: num(t[7]) });
      }
      continue;
    }
    if (inSummary && /^Maximum and minimum bending moment and shear force at each stage/.test(l)) {
      for (k = k + 1; k < lines.length; k++) {
        const t = toks(lines[k]); if (!lines[k].trim()) continue;
        if (t.length === 9 && t.every(isNum) && /^\d+$/.test(t[0])) { R.summary.stageMax.push({ stage: +t[0], MMax: num(t[1]), MMaxElev: num(t[2]), MMin: num(t[3]), MMinElev: num(t[4]), VMax: num(t[5]), VMaxElev: num(t[6]), VMin: num(t[7]), VMinElev: num(t[8]) }); continue; }
        if (/^[A-Z]/.test(lines[k]) && R.summary.stageMax.length) { k--; break; }
      }
      continue;
    }
    if (inSummary && /^Maximum and minimum displacement at each stage/.test(l)) {
      for (k = k + 1; k < lines.length; k++) {
        const mm2 = lines[k].match(new RegExp('^\\s*(\\d+)\\s+(' + NUM + ')\\s+(' + NUM + ')\\s+(' + NUM + ')\\s+(' + NUM + ')\\s+(.*)$'));
        if (mm2) { R.summary.stageDisp.push({ stage: +mm2[1], dMax: num(mm2[2]), dMaxElev: num(mm2[3]), dMin: num(mm2[4]), dMinElev: num(mm2[5]), desc: mm2[6].trim() }); continue; }
        if (!lines[k].trim() || /^\s*(no\.|m\s|Stage)/.test(lines[k]) || /^\s+m\s+m/.test(lines[k])) continue;
        if (R.summary.stageDisp.length) { k--; break; }
      }
      continue;
    }
    if (inSummary && /^Strut forces at each stage/.test(l)) {
      // WALLAP prints this table in blocks of up to three struts ("--- Strut no. 1 --- ... no. 3"), then
      // "--- Strut no. 4 --- ..." and so on, sometimes across a page break. Each block has its own header.
      let cols = []; const allCols = []; const byStage = new Map();
      for (k = k + 1; k < lines.length; k++) {
        const r = lines[k];
        if (!r.trim() || /^Summary of results/.test(r)) continue;
        if (/Strut no\./.test(r)) { cols = []; for (const x of r.matchAll(/-*\s*Strut no\.\s*(\d+)\s*-*/g)) { const c = { no: +x[1], start: x.index, end: x.index + x[0].length }; cols.push(c); allCols.push(c); } continue; }
        if (/at elev\./.test(r)) { let c = 0; for (const x of r.matchAll(new RegExp('at elev\\.\\s*(' + NUM + ')', 'g'))) { if (cols[c]) cols[c].elev = num(x[1]); c++; } continue; }
        if (/\/m run|\/strut|kN\/m/.test(r) || /^\s*(Stage|no\.)\s*$/.test(r)) continue;
        const mm2 = r.match(/^\s*(\d+)\s+(.*)$/);
        if (mm2 && cols.length) {
          const st = +mm2[1];
          let row = byStage.get(st); if (!row) { row = { stage: st, forces: {} }; byStage.set(st, row); }
          const re = new RegExp(NUM, 'g'); let x;
          const pieces = []; while ((x = re.exec(r))) pieces.push({ v: num(x[0]), end: x.index + x[0].length, start: x.index });
          pieces.shift(); // stage number
          for (const p of pieces) {
            let best = null, bd = 1e9;
            for (const c of cols) { const d = p.end < c.start ? c.start - p.end : p.start > c.end + 2 ? p.start - c.end : 0; if (d < bd) { bd = d; best = c; } }
            if (!best) continue;
            const f = row.forces[best.no] || (row.forces[best.no] = {});
            if (f.perM == null) f.perM = p.v; else if (f.perStrut == null) f.perStrut = p.v;
          }
          continue;
        }
        if (/^[A-Z]/.test(r) && !/^Stage/.test(r)) { k--; break; }
      }
      R.summary.strutForces = [...byStage.values()].sort((a, b) => a.stage - b.stage);
      R.summary.strutCols = allCols.map(c => ({ no: c.no, elev: c.elev }));
      continue;
    }
  }

  // ---- Derived: stage-by-stage geometry state
  const top = R.strata.length ? Math.max(...R.strata.map(s => s.top)) : (Object.values(R.results)[0]?.nodes[0]?.y ?? 0);
  R.derived = { wallTop: Object.values(R.results)[0]?.nodes[0]?.y ?? top, groundTop: top };
  let st = { glActive: top, glPassive: top, struts: [], surcharges: [], waterActive: R.water.active, waterPassive: R.water.passive, notes: [] };
  R.derived.stageState = [];
  for (const s of R.stages) {
    st = JSON.parse(JSON.stringify(st)); st.notes = [];
    const d = s.desc;
    let q;

const G = 9.81;
function U() {
  const base = (S.R?.meta.forceUnit || 't').toLowerCase();

  return {
    f, F, Fm: F + '/m', M: F + '·m/m', P: F === 't' ? 't/m²' : 'kPa', Gm: F === 't' ? 't/m³' : 'kN/m³',

}
const fx = (v, d = 1) => v == null || isNaN(v) ? '–' : (Math.abs(v) < 1e-9 ? 0 : v).toFixed(d);
const fF = (v, d = 1) => v == null ? '–' : fx(v * U().f, d);

function showMsg(html, kind = '') { const m = $('#msg'); if (!html) { m.hidden = true; return; } m.className = 'msg ' + kind; m.innerHTML = html; m.hidden = false; }
function selectReport(i, keepTab) {
  const rep = S.reports[i]; if (!rep) return;
  S.cur = i; S.R = rep.R; S.isExample = rep.isExample; S.fileName = rep.name;
  if (!keepTab) S.tab = 'overview';
  const detail = Object.keys(rep.R.results).map(Number);
  S.secStage = rep.R.stages.length ? rep.R.stages[rep.R.stages.length - 1].no : null;
  S.loadStage = detail.length ? detail[detail.length - 1] : null;

// returns an error string, or '' when the report was opened
function loadText(text, name, isExample, quiet) {
  const R = parseWallap(text);
  if (!R.stages.length && !R.summary.envelope.length) return `<b>${esc(name)}</b>: no WALLAP results found. Open the PDF report that WALLAP prints (it starts with "INPUT DATA" and ends with "Summary of results").`;
  if (isExample) {
    const j = S.reports.findIndex(r => r.isExample);
    if (j >= 0) { selectReport(j); return ''; }
    S.reports.push({ name, R, isExample: true });
  } else {
    S.reports = S.reports.filter(r => !r.isExample);
    const j = S.reports.findIndex(r => r.name === name);
    if (j >= 0) S.reports[j] = { name, R, isExample: false }; else S.reports.push({ name, R, isExample: false });
  }
  if (!quiet) selectReport(S.reports.findIndex(r => r.R === R));
  return R.warnings.length ? `<b>${esc(name)}</b>: ${R.warnings.map(esc).join(' ')}` : '';
}
let pdfjsPromise = null;
async function getPdfjs() {
  if (!pdfjsPromise) pdfjsPromise = (async () => {
    const lib = await import(PDFJS_BASE + 'pdf.min.mjs');
    const worker = await import(PDFJS_BASE + 'pdf.worker.min.mjs');
    globalThis.pdfjsWorker = worker;
    lib.GlobalWorkerOptions.workerSrc = PDFJS_BASE + 'pdf.worker.min.mjs';
    return lib;
  })().catch(e => { pdfjsPromise = null; throw new Error('the PDF reader could not be loaded. Check the internet connection and try again'); });
  return pdfjsPromise;
}
async function readFile(file) {
  const name = file.name || 'file';
  const buf = new Uint8Array(await file.arrayBuffer());
  const head = String.fromCharCode(...buf.slice(0, 5));
  try {
    if (head === '%PDF-') { const lib = await getPdfjs(); return loadText(await pdfToText(lib, buf), name, false, true); }
    if (/\.dat$/i.test(name) || buf.slice(0, 64).some(b => b === 0)) return `<b>${esc(name)}</b> is a WALLAP input data file (.dat). It holds the model, not the results. Print the results report from WALLAP to PDF and open that PDF here.`;
    return loadText(new TextDecoder().decode(buf), name, false, true);
  } catch (e) {
    console.error(e);
    return `<b>Couldn't read ${esc(name)}</b>: ${esc(e.message || e)}. Check that the PDF opens normally and was printed from WALLAP (not scanned).`;
  }
}
async function loadFiles(list) {
  const files = [...(list || [])].filter(Boolean); if (!files.length) return;
  const before = S.reports.filter(r => !r.isExample).length;
  const errs = [];
  for (let i = 0; i < files.length; i++) {
    showMsg(`Reading <b>${esc(files[i].name)}</b>${files.length > 1 ? ` (${i + 1} of ${files.length})` : ''}…`);
    const e = await readFile(files[i]); if (e) errs.push(e);
  }
  showMsg(errs.length ? errs.join('<br>') : '', errs.length ? 'err' : '');
  const opened = S.reports.filter(r => !r.isExample);
  if (opened.length > before || opened.length) {
    const lastName = [...files].reverse().map(f => f.name).find(n => opened.some(r => r.name === n));
    const j = S.reports.findIndex(r => r.name === lastName);
    if (j >= 0) { selectReport(j); return; }
  }
  render();
}
function closeReport(i) {
  S.reports.splice(i, 1);

// ---- ZIP (stored, no compression)
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_T[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function toZip(files) {
  const te = new TextEncoder(), parts = [], central = []; let off = 0;
  const d = new Date(), dt = ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1)) & 0xFFFF, dd = (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()) & 0xFFFF;
  for (const f of files) {
    const name = te.encode(f.name), data = typeof f.data === 'string' ? te.encode(f.data) : f.data, crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0, true); h.setUint16(8, 0, true); h.setUint16(10, dt, true); h.setUint16(12, dd, true);
    h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, name.length, true); h.setUint16(28, 0, true);
    parts.push(new Uint8Array(h.buffer), name, data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0, true); c.setUint16(10, 0, true); c.setUint16(12, dt, true); c.setUint16(14, dd, true);
    c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, name.length, true); c.setUint16(30, 0, true); c.setUint16(32, 0, true);
    c.setUint16(34, 0, true); c.setUint16(36, 0, true); c.setUint32(38, 0, true); c.setUint32(42, off, true);
    central.push(new Uint8Array(c.buffer), name);
    off += 30 + name.length + data.length;
  }
  const csize = central.reduce((a, b) => a + b.length, 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, csize, true); e.setUint32(16, off, true);
  const all = [...parts, ...central, new Uint8Array(e.buffer)];
  const out = new Uint8Array(all.reduce((a, b) => a + b.length, 0)); let p = 0; for (const a of all) { out.set(a, p); p += a.length; }
  return out;
}

// ---- screen preview of a model (paper sheet)
function previewSVG(m, forPrint) {
  const pad = 0.6, x0 = m.bb.xmin - pad, y1 = m.bb.ymax + pad, W = m.bb.xmax - m.bb.xmin + 2 * pad, H = m.bb.ymax - m.bb.ymin + 2 * pad;
  const P = (x, y) => `${(x - x0).toFixed(3)},${(y1 - y).toFixed(3)}`;
  const o = [];
  for (const it of m.items) if (it.t === 'line') o.push(`<polyline points="${it.pts.map(p => P(p[0], p[1])).join(' ')}" fill="none" stroke="${EXP_INK[it.layer]}" stroke-width="${((EXP_W[it.layer] || 0.18) / 10 * (forPrint ? 1 : 1.6)).toFixed(3)}" stroke-linejoin="round" stroke-linecap="round"/>`);
  for (const it of m.items) if (it.t === 'text') { const x = it.x - x0, y = y1 - it.y; o.push(`<text x="${x.toFixed(3)}" y="${y.toFixed(3)}" font-size="${(it.h / 0.718).toFixed(3)}" fill="${EXP_INK[it.layer]}" text-anchor="${it.align === 'center' ? 'middle' : it.align === 'right' ? 'end' : 'start'}"${it.rot ? ` transform="rotate(${-it.rot} ${x.toFixed(3)} ${y.toFixed(3)})"` : ''} font-family="Helvetica, Arial, sans-serif">${esc(it.s)}</text>`); }
  return `<svg viewBox="0 0 ${W.toFixed(2)} ${H.toFixed(2)}" role="img" aria-label="${esc(m.title)} at 1:100">${o.join('')}</svg>`;
}

// ---- Export tab
// Inside Claude the page saves files through the downloads capability; on a normal website it uses plain browser downloads and printing.
const IN_CLAUDE = !!(window.claude && window.claude.use);
let DL = IN_CLAUDE ? undefined : null;   // undefined while checking, null when the capability is absent
if (IN_CLAUDE) (async () => { try { DL = await window.claude.use('downloads'); } catch (e) { DL = null; } if (S.R && (S.tab === 'export' || DL === null)) render(); })();
const CAN_PRINT = !IN_CLAUDE;
// Drawing scale/units for DXF. Default: 1:100 in mm on the sheet.
const EXP_SCALES = [100, 50];
const EXP_UNITS = [
  { v: 'p-mm', k: sc => 1000 / sc, sheet: true, tag: sc => `1-${sc}_mm`, label: sc => `Drawn at 1:${sc}, mm on the sheet (1 m = ${1000 / sc} units)` },
  { v: 'p-cm', k: sc => 100 / sc, sheet: true, tag: sc => `1-${sc}_cm`, label: sc => `Drawn at 1:${sc}, cm on the sheet (1 m = ${100 / sc} unit${100 / sc === 1 ? '' : 's'})` },
  { v: 'cm', k: () => 100, tag: sc => `real-size_cm_text-1-${sc}`, label: sc => `Real size in cm (1 m = 100 units), text sized for 1:${sc}` },
  { v: 'mm', k: () => 1000, tag: sc => `real-size_mm_text-1-${sc}`, label: sc => `Real size in mm (1 m = 1000 units), text sized for 1:${sc}` },
];
const EXP = { kinds: { anchors: true, M: true, V: true, D: true }, unit: 'p-mm', scale: 100 };
try { const e = JSON.parse(localStorage.getItem('wr-exp2') || 'null'); if (e && e.kinds) Object.assign(EXP, e); } catch (e) {}
if (!EXP_UNITS.some(x => x.v === EXP.unit)) EXP.unit = 'p-mm';
if (!EXP_SCALES.includes(EXP.scale)) EXP.scale = 100;
const expUnit = () => EXP_UNITS.find(x => x.v === EXP.unit);
function expSave() { try { localStorage.setItem('wr-exp2', JSON.stringify(EXP)); } catch (e) {} }
function safeName(s) { return String(s).replace(/[^A-Za-z0-9._-]+/g, '_').replace(/^_+|_+$/g, '') || 'section'; }
let toastT;
function toast(text, kind = '') { const t = $('#toast'); if (!t) return; t.textContent = text; t.className = 'toast ' + kind; t.hidden = false; clearTimeout(toastT); if (kind !== 'wait') toastT = setTimeout(() => { t.hidden = true; }, 4500); }
async function saveFile(filename, data, msgEl) {
  const say = (txt, kind) => { if (msgEl) { msgEl.textContent = txt; msgEl.className = 'exp-msg ' + kind; } toast(txt, kind); };
  if (!DL && !IN_CLAUDE) {
    const blob = new Blob([data], { type: /\.pdf$/.test(filename) ? 'application/pdf' : /\.zip$/.test(filename) ? 'application/zip' : 'application/octet-stream' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000); say(`Downloaded ${filename}`, 'ok'); return;
  }
  if (!DL) { say('Saving files is not available in this view. Open the page on claude.ai to download.', 'err'); return; }
  say('Confirm the download to save ' + filename, 'wait');
  try { await DL.save({ filename, data }); say(`Saved ${filename}`, 'ok'); }
  catch (e) {
    const code = e && e.code;
    say(code === 'declined' ? 'Download cancelled.' : code === 'rate_limited' ? 'Another download prompt is already open. Finish it, then try again.' : `Couldn't save the file (${code || e}).`, code === 'declined' ? '' : 'err');
  }
}
function dxfFiles(R, kinds) {
  const base = safeName(sectionName(R)), un = expUnit();
  const sc = EXP.scale, tag = un.tag(sc), k = un.k(sc);
  const models = kinds.map(kd => exportModel(R, kd, sc));
  const files = models.map(m => ({ name: `${base}_${EXP_KINDS.find(x => x.k === m.kind).short}_${tag}.dxf`, data: toDXF([m], k) }));
  if (models.length > 1) files.push({ name: `${base}_all_${tag}.dxf`, data: toDXF(models, k) });
  return { base, un, files, models, tag };
}
function exportDXF(R, kinds, msgEl) { const { base, files, tag } = dxfFiles(R, kinds); const nm = kinds.length === 1 ? `${base}_${EXP_KINDS.find(x => x.k === kinds[0]).short}_${tag}_DXF.zip` : `${base}_${tag}_DXF.zip`; saveFile(nm, toZip(files), msgEl); }
function exportPDF(R, kinds, msgEl) { const sc = EXP.scale, base = safeName(sectionName(R)); const nm = kinds.length === 1 ? `${base}_${EXP_KINDS.find(x => x.k === kinds[0]).short}_1-${sc}.pdf` : `${base}_1-${sc}.pdf`; saveFile(nm, toPDF(kinds.map(k => exportModel(R, k, sc))), msgEl); }
// small "DXF 1:100 / PDF" buttons placed on each drawing
function quickExp(kind) {
  const sc = EXP.scale;
  return `<span class="exp-quick"><span class="seg sm" role="group" aria-label="Scale">${EXP_SCALES.map(v => `<button type="button" data-qscale="${v}" aria-pressed="${sc === v}">1:${v}</button>`).join('')}</span><button type="button" class="btn sm" data-qx="dxf" data-kind="${kind}" title="Download this drawing as DXF at the selected scale">DXF</button><button type="button" class="btn sm" data-qx="pdf" data-kind="${kind}" title="Download a PDF at the selected scale">PDF</button>${CAN_PRINT ? `<button type="button" class="btn sm" data-qx="print" data-kind="${kind}" title="Print this drawing at the selected scale">Print</button>` : ''}</span>`;
}
function wireQuick(root) {
  root.querySelectorAll('[data-qx]').forEach(b => b.onclick = () => ({ dxf: exportDXF, pdf: exportPDF, print: printDrawings }[b.dataset.qx])(S.R, [b.dataset.kind]));
  // one scale for every drawing; update the switches in place so the page doesn't jump
  root.querySelectorAll('[data-qscale]').forEach(b => b.onclick = () => {
    EXP.scale = +b.dataset.qscale; expSave();
    document.querySelectorAll('[data-qscale]').forEach(x => x.setAttribute('aria-pressed', String(+x.dataset.qscale === EXP.scale)));
    toast(`Drawings will export at 1:${EXP.scale}`, 'ok');
  });
}
// Print at true 1:100: each drawing on its own page, sized in mm (1 m = 10 mm)
function printDrawings(R, kinds) {
  const sc = EXP.scale, mpm = 1000 / sc;
  const models = kinds.map(k => exportModel(R, k, sc));
  const size = m => [(m.bb.xmax - m.bb.xmin + 1.2) * mpm, (m.bb.ymax - m.bb.ymin + 1.2) * mpm];
  const sheets = [['A4 portrait', 190, 270], ['A4 landscape', 277, 183], ['A3 portrait', 277, 393], ['A3 landscape', 400, 270], ['A2 portrait', 400, 567], ['A2 landscape', 574, 393], ['A1 portrait', 574, 814], ['A1 landscape', 821, 567], ['A0 portrait', 821, 1162]];
  const need = models.map(size);
  const sheet = sheets.find(([, w, h]) => need.every(([a, b]) => a <= w && b <= h)) || sheets[sheets.length - 1];
  let area = document.getElementById('printArea');
  if (!area) { area = document.createElement('div'); area.id = 'printArea'; document.body.appendChild(area); }
  area.innerHTML = models.map((m, i) => { const [w, h] = need[i]; return `<section class="print-page">${previewSVG(m, true).replace('<svg ', `<svg width="${w.toFixed(1)}mm" height="${h.toFixed(1)}mm" `)}<p class="print-note">${esc(sectionName(R))} · scale 1:${sc} on ${sheet[0]} · print at 100% (actual size): the 5 m bar measures ${5000 / sc} mm</p></section>`; }).join('');
  let st = document.getElementById('printPageStyle');
  if (!st) { st = document.createElement('style'); st.id = 'printPageStyle'; document.head.appendChild(st); }
  st.textContent = `@page { size: ${sheet[0].replace(' portrait', '').replace(' landscape', '')} ${/landscape/.test(sheet[0]) ? 'landscape' : 'portrait'}; margin: 10mm; }`;
  toast(`Printing on ${sheet[0]}. Set the scale to 100% / Actual size.`, 'ok');
  setTimeout(() => window.print(), 50);
}
function renderExport(el0) {
  const R = S.R, u = U();
  const which = EXP_KINDS.filter(x => EXP.kinds[x.k] && (x.k !== 'anchors' || R.struts.length)).map(x => x.k);
  const sc = EXP.scale;
  const models = which.map(k => exportModel(R, k, sc));
  el0.innerHTML = `
  <div class="panel">
    <div class="panel-head"><h2>Drawings at 1:${sc} · ${esc(sectionName(R))}</h2><span class="hint">Wall at x = 0 and level ±0.00 at y = 0, so each drawing lines up with your own section.</span></div>
    <div class="exp-opts">
      <fieldset><legend>Drawings</legend>${EXP_KINDS.map(x => `<label class="chk"><input type="checkbox" id="exp-${x.k}" data-k="${x.k}" ${EXP.kinds[x.k] ? 'checked' : ''} ${x.k === 'anchors' && !R.struts.length ? 'disabled' : ''}> ${x.label}</label>`).join('')}</fieldset>
      <div class="sel"><span id="exp-scale-l">Scale</span><div class="seg" role="group" aria-labelledby="exp-scale-l">${EXP_SCALES.map(v => `<button type="button" data-scale="${v}" aria-pressed="${sc === v}">1:${v}</button>`).join('')}</div></div>
      <label class="sel" for="exp-unit"><span>DXF units</span><select id="exp-unit">${EXP_UNITS.map(x => `<option value="${x.v}" ${EXP.unit === x.v ? 'selected' : ''}>${x.label(sc)}</option>`).join('')}</select></label>
      <div class="exp-btns">
        <button type="button" class="btn primary" id="exp-dxf" ${which.length ? '' : 'disabled'}>Download DXF 1:${sc} (.zip)</button>
        <button type="button" class="btn" id="exp-pdf" ${which.length ? '' : 'disabled'}>PDF 1:${sc}</button>
        ${CAN_PRINT ? `<button type="button" class="btn" id="exp-print" ${which.length ? '' : 'disabled'}>Print 1:${sc}</button>` : ''}
      </div>
    </div>
    <p class="exp-msg" id="exp-msg">${DL === null && IN_CLAUDE ? 'Saving files is not available in this view. Open the page on claude.ai to download.' : ''}</p>
    <ul class="hint exp-notes">
      <li><b>Scale</b>: 1:100 is the default; 1:50 draws everything twice as large on the sheet. Text and symbols stay 2.5 mm high at either scale.</li>
      <li><b>DXF</b> (default mm on the sheet): one file per drawing plus one with all of them side by side, AutoCAD R12 format, layers named WLP-. Choose real size if you draw full size in model space.</li>
      <li><b>PDF</b>: one page per drawing on the smallest A-size sheet that fits, for printing at actual size (the 5 m bar measures ${5000 / sc} mm).</li>${CAN_PRINT ? `<li><b>Print</b>: sends the drawings straight to your printer. In the print dialog set the scale to 100% / Actual size.</li>` : ''}
      <li>Every drawing in the app has its own DXF and PDF buttons using these settings. Forces are in ${esc(u.F)} as selected at the top of the page, and each diagram states its value scale (1 cm on the sheet = so many ${esc(asciiUnit(u.M))}).</li>
    </ul>
  </div>
  <div class="paper-grid">${models.map(m => `<figure class="paper" style="flex:${(m.bb.xmax - m.bb.xmin + 1.2).toFixed(2)} 1 0"><div class="paper-sheet">${previewSVG(m)}</div><figcaption>${esc(EXP_KINDS.find(x => x.k === m.kind).label)} · 1:${sc}${m.diag ? ` · 1 cm = ${m.diag.perCm} ${esc(m.diag.unit)}` : ''}</figcaption></figure>`).join('')}</div>`;
  const msg = el0.querySelector('#exp-msg');
  el0.querySelectorAll('input[data-k]').forEach(c => c.onchange = () => { EXP.kinds[c.dataset.k] = c.checked; expSave(); render(); });
  el0.querySelector('#exp-unit').onchange = e => { EXP.unit = e.target.value; expSave(); render(); };
  el0.querySelectorAll('[data-scale]').forEach(b => b.onclick = () => { EXP.scale = +b.dataset.scale; expSave(); render(); });
  el0.querySelector('#exp-dxf').onclick = () => exportDXF(R, which, msg);
  el0.querySelector('#exp-pdf').onclick = () => exportPDF(R, which, msg);
  const pb = el0.querySelector('#exp-print'); if (pb) pb.onclick = () => printDrawings(R, which);
}

// ---------- STAGES
function renderStages(el0) {
  const R = S.R, u = U();
  const sf = strutForceRows(R);
  const target = R.options.fosTarget;
  el0.innerHTML = `
  <div class="panel">
    <div class="panel-head"><h2>Construction sequence</h2><span class="hint">${esc(R.options.stabilityMethod || '')}${target ? ` · required FoS on soil strength ${target.toFixed(2)}` : ''}</span></div>
    <div class="tscroll"><table><thead><tr><th class="l">Stage</th><th class="l">What happens</th><th>Ground<small>ret. / exc.</small></th><th>FoS</th><th>Toe for FoS<small>el.</small></th><th>M max / min<small>${u.M}</small></th><th>V max<small>${u.Fm}</small></th><th>Displ.<small>mm</small></th><th>Strut forces<small>${u.Fm}, horizontal</small></th></tr></thead><tbody>
    ${R.stages.map(s => {
      const st = R.summary.stability.find(x => x.stage === s.no) || R.results[s.no]?.stability; const g = R.derived.stageState.find(x => x.stage === s.no);
      const m = R.summary.stageMax.find(x => x.stage === s.no); const d = R.summary.stageDisp.find(x => x.stage === s.no);
      const f = sf.filter(r => r.stage === s.no);
      const fos = st?.fos != null ? `${st.fos.toFixed(2)} ${target ? (st.fos >= target ? '<span class="chip good">✓</span>' : '<span class="chip crit">▼ low</span>') : ''}` : `<span class="hint">${st?.note ? 'n/a' : '–'}</span>`;
      return `<tr><td class="l">${s.no}</td><td class="txt">${esc(s.desc)}</td><td>${el(g?.glActive)} / ${el(g?.glPassive)}</td><td>${fos}</td><td>${st?.toeForFos != null ? el(st.toeForFos) : '–'}</td><td>${m ? fF(m.MMax) + ' / ' + fF(m.MMin) : '–'}</td><td>${m ? fF(Math.max(Math.abs(m.VMax), Math.abs(m.VMin))) : '–'}</td><td>${d ? mm(Math.max(Math.abs(d.dMax), Math.abs(d.dMin))) : '–'}</td><td>${f.length ? f.map(r => `Strut ${r.no}: ${fF(r.perM, 2)}`).join('<br>') : '–'}</td></tr>`;
    }).join('')}</tbody></table></div>
    <p class="hint" style="margin:8px 0 0">"n/a" means WALLAP reported the stage as not suitable for a factor of safety calculation.</p>
  </div>
  <div class="panel"><h3 style="margin-bottom:6px">Analysis settings</h3><div class="keys">
    <div><span>Moment calculation</span><b style="font-family:var(--font-body)">${esc(R.options.bmMethod || '–')}</b></div>
    <div><span>Wall length in model</span><b>${R.options.wallLength ?? '–'} m</b></div>
    <div><span>Wall E / I</span><b>${R.wall.E ? (R.wall.E * u.f).toExponential(3) : '–'} ${u.P} / ${R.wall.I ?? '–'} m⁴/m</b></div>
    <div><span>Yield moment</span><b style="font-family:var(--font-body)">${esc(R.wall.yieldMoment || '–')}</b></div>
  </div></div>`;
}
